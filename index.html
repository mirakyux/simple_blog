<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/mirakyux.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mirakyux blog</title>
  <meta name="description" content="A custom blog framework built with React and Vite" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://example.com/" />
  <meta property="og:title" content="mirakyux blog" />
  <meta property="og:description" content="A custom blog framework built with React and Vite" />
  <meta property="og:image" content="/mirakyux.svg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://example.com/" />
  <meta property="twitter:title" content="mirakyux blog" />
  <meta property="twitter:description" content="A custom blog framework built with React and Vite" />
  <meta property="twitter:image" content="/mirakyux.svg" />

  <script>
    (function () {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
